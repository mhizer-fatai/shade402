[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

# Netlify build settings, versioned with the code (no UI setup needed).
[build.environment]
  NODE_VERSION = "22"
  VITE_API_URL = "https://shade402-api.onrender.com"

# SPA fallback: the app uses real URL paths (/dashboard), so deep links and
# refreshes must serve index.html instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
